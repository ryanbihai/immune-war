/* =========================================================
   主循环
   ========================================================= */
var last=0, acc=0, STEP=1/60;
var PAUSED=false;                       // 录制/调试用：暂停主循环，改为手动逐帧
function loop(ts){
  if (!last) last=ts;
  var dt=(ts-last)/1000; last=ts;
  if (PAUSED){ requestAnimationFrame(loop); return; }
  if (dt>0.12) dt=0.12;
  acc+=dt;
  // 掉帧时不"补课"：以前最多一帧补 8 步，画面一卡就会连跑 8 步，
  // 相当于把游戏快进 1.7 倍 —— 后期病毒一多就会看到一段高速混乱。
  // 现在积压最多留 3 步（50ms），宁可慢一点也不要突然快进。
  if (acc > STEP*3) acc = STEP*3;
  var guard=0;
  while (acc>=STEP && guard++<3){ update(STEP); acc-=STEP; }

  for (var i=0;i<DUST.length;i++){
    var d=DUST[i];
    d.y -= d.vy*dt; d.x += d.vx*dt;
    if (d.y<TOP_EDGE){ d.y=LINE_Y; d.x=rand()*W; }
    if (d.x<0) d.x+=W;
    if (d.x>W) d.x-=W;
  }
  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   一次完整对局（无渲染）
   遗传算法和游戏内"进化"按钮都走这一条路径，训练和实战是同一份代码。
   拆成 make / step 两半，是为了游戏内的"进化实验室"能分帧跑，不卡界面。
   ========================================================= */
function makeEpisode(opt){
  opt = opt || {};
  if (opt.tac) ACTIVE_TAC = cloneTac(opt.tac);
  if (opt.enemy) ENEMY_ACTIVE = cloneEnemy(opt.enemy);
  if (opt.auction !== undefined) CFG.auction = !!opt.auction;
  if (opt.gateGuard !== undefined) CFG.gateGuard = opt.gateGuard|0;
  if (opt.needK !== undefined) CFG.needK = +opt.needK;
  if (opt.hpK !== undefined) CFG.hpK = +opt.hpK;
  if (opt.dmgK !== undefined) CFG.dmgK = +opt.dmgK;
  if (opt.spK !== undefined) CFG.spK = +opt.spK;
  start(opt.seed===undefined ? 1 : opt.seed);
  return { cap: Math.round((opt.maxSec||200)*60), steps:0,
           aliveSum:0, aliveMax:0, maxLv:0, done:false, res:null };
}

function stepEpisode(e, n){
  while (n-- > 0 && !e.done){
    update(1/60); e.steps++;
    e.aliveSum += G.viruses.length;
    if (G.viruses.length > e.aliveMax) e.aliveMax = G.viruses.length;
    for (var mi=0; mi<G.viruses.length; mi++){
      if (G.viruses[mi].lv > e.maxLv) e.maxLv = G.viruses[mi].lv;
    }
    if (G.phase!=='play' || e.steps>=e.cap) e.done=true;
  }
  if (!e.done) return null;
  if (e.res) return e.res;
  var ks=G.killStage, tot=0;
  for (var q=0;q<5;q++) tot+=ks[q];
  e.res = {
    score:+G.score.toFixed(2),
    kills:G.killed,
    waves:G.wave,
    sec:+G.time.toFixed(1),
    lost:+Math.max(0, 1-G.cells.length/CFG.squad).toFixed(3),
    alive:G.cells.length,
    lv:[ks[0],ks[1],ks[2],ks[3],ks[4]],
    early: tot ? +(ks[0]/tot).toFixed(3) : 0,
    aliveAvg: e.steps ? +(e.aliveSum/e.steps).toFixed(1) : 0,
    aliveMax: e.aliveMax,
    maxLv: e.maxLv,
    died: G.phase==='over'
  };
  return e.res;
}

function runEpisode(opt){
  var e = makeEpisode(opt);
  var r = null;
  while (!r) r = stepEpisode(e, 4000);
  return r;
}

function setTac(t){
  ACTIVE_TAC = cloneTac(t);
  return ACTIVE_TAC;
}
function getTac(){ return cloneTac(ACTIVE_TAC); }

/* ---- 战术基因的一维表示：遗传算法在数组上做变异 ---- */
var TAC_KEYS = (function(){ var a=[]; for (var k in TAC_BOUNDS) a.push(k); return a; })();
var TAC_SPANS = (function(){ var a=[]; for (var i=0;i<TAC_KEYS.length;i++) a.push(TAC_BOUNDS[TAC_KEYS[i]]); return a; })();
function tacToVec(t){ var v=[]; for (var i=0;i<TAC_KEYS.length;i++) v.push(+t[TAC_KEYS[i]]||0); return v; }
function vecToTac(v){ var t={}; for (var i=0;i<TAC_KEYS.length;i++) t[TAC_KEYS[i]]=+v[i].toFixed(4); return t; }

/* =========================================================
   累积进化
   每打完一盘，敌我各试一个变异体；赢的那个留下，存进 localStorage。
   下一盘直接从进化后的状态开始 —— 越打越难，也越打越强。
   ========================================================= */
var DNA_KEY='immune_dna_v1';
var DNA=null;

function dnaLoad(){
  try { var s=localStorage.getItem(DNA_KEY); DNA = s ? JSON.parse(s) : null; } catch(e){ DNA=null; }
  if (!DNA || !DNA.player || !DNA.enemy){
    DNA={ gen:0, player:cloneTac(TAC_CHAMP), enemy:cloneEnemy(ENEMY_DEFAULT), best:0 };
  }
  return DNA;
}
function dnaSave(){ try { localStorage.setItem(DNA_KEY, JSON.stringify(DNA)); } catch(e){} }

// 第 1 号选项永远 = 「上次进化的结果」
function syncCarry(){
  ENEMY_ACTIVE = cloneEnemy(DNA.enemy);
}

function enemyToVec(e){ var v=[]; for (var k in ENEMY_BOUNDS) v.push(+e[k]); return v; }
function vecToEnemy(v){ var o={}, i=0; for (var k in ENEMY_BOUNDS) o[k]=+v[i++].toFixed(3); return o; }
var ENEMY_SPANS=(function(){ var s=[]; for (var k in ENEMY_BOUNDS) s.push(ENEMY_BOUNDS[k]); return s; })();

function mutVec(v, spans, sigma){
  var out=[];
  for (var i=0;i<v.length;i++){
    var lo=spans[i][0], hi=spans[i][1], sp=hi-lo, x=v[i];
    if (rand()<0.05) x=lo+rand()*sp;
    else if (rand()<0.45) x += (rand()*2-1)*sigma*sp*0.6;
    out.push(x<lo?lo:(x>hi?hi:x));
  }
  return out;
}

function playerFit(eps){
  var n=eps.length; if(!n) return 0;
  var M=function(k){ var s=0; for(var i=0;i<n;i++) s+=eps[i][k]; return s/n; };
  // 得分是主项，早杀率给乘数，再奖励「撑得更久」。
  // 这里原来是 20*(1 - sec/160)：随存活时间【下降】，注释却写着「奖励撑得更久」，
  // 方向是反的；而且 160 秒以上的局里它恒等于 0，等于从来没生效过。
  return M('score')*(0.6+0.8*M('early'))
       + 30*M('waves')
       + 20*Math.min(1, M('sec')/240);
}
// 病毒的奖励：把玩家打崩得有多快、压住多少得分、养出多大的病毒。
// 注意不能用「杀掉多少细胞」当主项 —— 反正每局都打到全灭，那一项永远是满的，
// 没有区分度。真正有区别的是「多快」，所以用存活时间当主项。
function enemyFit(eps){
  var n=eps.length; if(!n) return 0;
  var M=function(k){ var s=0; for(var i=0;i<n;i++) s+=eps[i][k]; return s/n; };
  return 45*(1-Math.min(1, M('sec')/160))
       + 30*(1-Math.min(1, M('score')/260))
       + 25*(M('maxLv')/4)
       + 10*M('lost');
}

var EVO=null;
var EVO_SEEDS=[7,19,31];
var EVO_MUTS=3;             // 每边试几个变异体

function evoStart(){
  if (EVO || !DNA) return;
  var P=DNA.player, E=DNA.enemy;
  var ps=[], es=[], q=[];
  for (var m=0;m<EVO_MUTS;m++){
    ps.push(vecToTac(mutVec(tacToVec(P), TAC_SPANS, 0.22)));
    es.push(vecToEnemy(mutVec(enemyToVec(E), ENEMY_SPANS, 0.24)));
  }
  var res={base:[]};
  for (var m2=0;m2<EVO_MUTS;m2++){ res['p'+m2]=[]; res['e'+m2]=[]; }
  for (var s=0;s<EVO_SEEDS.length;s++){
    q.push({tag:'base', tac:P, enemy:E, seed:EVO_SEEDS[s]});
    for (var a=0;a<EVO_MUTS;a++) q.push({tag:'p'+a, tac:ps[a], enemy:E,  seed:EVO_SEEDS[s]});
    for (var b=0;b<EVO_MUTS;b++) q.push({tag:'e'+b, tac:P,  enemy:es[b], seed:EVO_SEEDS[s]});
  }
  EVO={ q:q, i:0, res:res, ep:null, job:null, Ps:ps, Es:es, done:false, prevQuiet:QUIET };
  QUIET=true;
  requestAnimationFrame(evoTick);
}

function evoTick(){
  if (!EVO || EVO.done) return;
  var t0=performance.now();
  while (performance.now()-t0 < 8){
    if (!EVO.ep){
      if (EVO.i >= EVO.q.length){ evoFinish(); return; }
      EVO.job=EVO.q[EVO.i];
      ENEMY_ACTIVE=cloneEnemy(EVO.job.enemy);
      EVO.ep=makeEpisode({ tac:EVO.job.tac, seed:EVO.job.seed, maxSec:190 });
    }
    var r=stepEpisode(EVO.ep, 90);
    if (r){ EVO.res[EVO.job.tag].push(r); EVO.ep=null; EVO.i++; }
  }
  requestAnimationFrame(evoTick);
}

function evoFinish(){
  EVO.done=true;
  QUIET=EVO.prevQuiet;
  var p0=playerFit(EVO.res.base), e0=enemyFit(EVO.res.base);
  var notes=[];
  // 玩家：挑最好的那个变异体，要比现状好 2% 才留下
  var bp=-1e9, bi=-1;
  for (var i=0;i<EVO.Ps.length;i++){
    var v=playerFit(EVO.res['p'+i]);
    if (v>bp){ bp=v; bi=i; }
  }
  if (bp > p0*1.01){ DNA.player=EVO.Ps[bi]; notes.push('这套打法进步了'); }
  var be=-1e9, bj=-1;
  for (var j=0;j<EVO.Es.length;j++){
    var v2=enemyFit(EVO.res['e'+j]);
    if (v2>be){ be=v2; bj=j; }
  }
  if (be > e0*1.01){ DNA.enemy=EVO.Es[bj]; notes.push('病毒也换了新招'); }
  DNA.gen=(DNA.gen||0)+1;
  dnaSave();
  syncCarry();
  ACTIVE_TAC=cloneTac(DNA.player);
  ENEMY_ACTIVE=cloneEnemy(DNA.enemy);
  G.evoNote=(LANG==='en'?'Gen '+DNA.gen+' · ':'第 '+DNA.gen+' 代 · ')+
            (notes.length?notes.map(function(n){return T(n);}).join(' · '):T('这一盘双方都没什么长进'));
  // 训练把 G 换成了某一局对局，这里必须还回去，
  // 否则结算页会闪一下然后变成"一局敌人堆在顶部"的游戏画面。
  G.phase='over';
  G.viruses=[]; G.bullets=[]; G.fx=[]; G.shells=[]; G.marks=[];
  EVO=null;
}

dnaLoad();
syncCarry();
applyLang();

var _langBtn=document.getElementById('langBtn');
if (_langBtn) _langBtn.addEventListener('click', function(e){
  e.stopPropagation();
  LANG = (LANG==='en') ? 'zh' : 'en';
  try{ localStorage.setItem('iw_lang', LANG); }catch(e){}
  applyLang();
  if (typeof render === 'function' && G.phase !== 'intro') render();
});

var _startBtn2=document.getElementById('startBtn');
if (_startBtn2) _startBtn2.addEventListener('click', function(){ beginBattle(); });

if (HEADLESS){
  fitStage();                       // 只算布局，不建背景、不跑主循环
} else {
  resize();
  syncHUD();
  // 没有开场菜单了：直接从存档里的战术开局
  ACTIVE_TAC = cloneTac(DNA.player);
  start();
  requestAnimationFrame(loop);
}

window.__G = G;
window.__game = {
  G:G, start:start, update:update, throwMark:throwMark,
  W:function(){ return W; }, H:function(){ return H; }, LINE_Y:function(){ return LINE_Y; },
  waveCfg:waveCfg, visible:visible, CFG:CFG, TYPES:TYPES, lvOf:lvOf,
  waveTotal:waveTotal, buildWaveList:buildWaveList, typeRange:typeRange, WAVE_RULE:WAVE_RULE,
  bestMarkSpot:bestMarkSpot, say:say, sayClear:sayClear, SAYS:SAYS,
  seedRng:seedRng, rand:rand, HEADLESS:HEADLESS,
  runEpisode:runEpisode, makeEpisode:makeEpisode, stepEpisode:stepEpisode, setTac:setTac, getTac:getTac,
  TAC_BOUNDS:TAC_BOUNDS, TAC_DEFAULT:TAC_DEFAULT, cloneTac:cloneTac,
  tacToVec:tacToVec, vecToTac:vecToTac,
  setSteps:function(n){ STEPS = Math.max(0, n|0); }, getSteps:function(){ return STEPS; },
  stepPoints:stepPoints, ranksFor:ranksFor, beginBattle:beginBattle,
  getDNA:function(){ return DNA; }, dnaLoad:dnaLoad, syncCarry:syncCarry, evoStart:evoStart, getEVO:function(){ return EVO; }, enemyFit:enemyFit, playerFit:playerFit,
  render:render, pause:function(v){ PAUSED=!!v; }, tick:function(dt){ update(dt||STEP); render(); }
};

})();
</script>
</body>
</html>
